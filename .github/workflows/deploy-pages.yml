name: Deploy handbook to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mkdocs-requirements.txt
      - run: pip install -r mkdocs-requirements.txt
      # github_slug.py (the GitHub-exact heading slugger) must be importable
      # from mkdocs.yml's `!!python/name:` reference. NO_MKDOCS_2_WARNING
      # silences the Material end-of-life banner, which is stderr noise.
      - run: mkdocs build -f .site/mkdocs.yml
        env:
          PYTHONPATH: ${{ github.workspace }}/76-CheatSheets/scripts
          NO_MKDOCS_2_WARNING: "1"
      # mkdocs dedupes repeated headings as "<base>_1"; GitHub uses "<base>-1".
      # The corpus links to GitHub's form, so rewrite the suffixes post-build.
      - run: python3 .site/fix-slugs.py /tmp/site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
