# .site/mkdocs.yml — publishes the handbook as the GitHub Pages site.
#
# The docs directory IS the repository root (docs_dir: ..): every chapter, lab,
# cheatsheet and script ships as a page exactly where it sits in the tree.
# Relative .md links resolve the same way they do on GitHub, and heading
# anchors are minted by 76-CheatSheets/scripts/github_slug.py (GitHub's exact
# slug rules — the same rules check-anchors.py validates the corpus against),
# so the ~7,700 verified fragment links survive the markdown-to-website
# translation.
#
# The config lives in .site/ (not the repo root) because mkdocs refuses a
# docs_dir that is the config file's own directory. The nav below is explicit
# and mechanical: one directory entry per chapter directory. If a chapter is
# added, add its line here.

site_name: Android Security Handbook
site_description: >-
  A hands-on Android security handbook — measured chapters, runnable labs and
  examples, built around what actually happens on real devices and real apps.
site_url: https://flyphantomfly.github.io/android-security-handbook/
repo_url: https://github.com/FlyPhantomFly/android-security-handbook
repo_name: FlyPhantomFly/android-security-handbook
edit_uri: edit/main/
copyright: Content CC BY 4.0 · Code MIT

# The site builds out of the tree (a site_dir inside docs_dir is not allowed).
site_dir: /tmp/site
docs_dir: ..

# Files on disk that are not part of the published handbook.
exclude_docs: |
  /.git/
  /.github/
  /.site/
  /site/
  /planning-guide.md
  /mkdocs-requirements.txt
  __pycache__/
  *.py[cod]

theme:
  name: material
  font: false
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - content.action.view
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - toc:
      # GitHub-exact heading slugs (see scripts/github_slug.py).
      slugify: !!python/name:github_slug.slugify
      permalink: true
  - tables
  - sane_lists
  - pymdownx.superfences:
      # Mermaid diagrams (~834 of them) render client-side; the fenced source
      # in the repository is passed through untouched.
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true

validation:
  nav:
    omitted_files: ignore
  links:
    not_found: warn
    anchors: warn
    absolute_links: ignore
